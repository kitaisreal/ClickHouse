services:
  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    ports:
      - "9023:9023"
      - "9024:9024"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9024" --address ":9023"
    volumes:
      - minio-data:/data

  createbucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9023 minioadmin minioadmin;
      mc mb test-bucket;
      exit 0;
      "

volumes:
  minio-data:

